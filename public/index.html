<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>YudamandalaAR</title>
    <link rel="icon" href="/icon.png" />
    <!-- Keeping Tailwind CDN for simplicity as per existing setup -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #1a1a1a;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      /* 3D Scene Config */
      .scene-3d {
        perspective: 1000px;
        width: 250px;
        height: 250px;
        touch-action: none; /* Prevent scrolling while dragging cube */
      }
      
      .cube {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        /* Animation handled by JS for interaction */
      }

      .cube-face {
        position: absolute;
        width: 250px;
        height: 250px;
        border: 2px solid rgba(255, 165, 0, 0.8); /* Orange border for Heroism */
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        box-shadow: 0 0 20px rgba(255, 140, 0, 0.3);
        backface-visibility: visible; /* Make translucent */
        user-select: none;
      }

      /* Cube Positioning */
      .front  { transform: rotateY(0deg) translateZ(125px); }
      .right  { transform: rotateY(90deg) translateZ(125px); }
      .back   { transform: rotateY(180deg) translateZ(125px); }
      .left   { transform: rotateY(-90deg) translateZ(125px); }
      .top    { transform: rotateX(90deg) translateZ(125px); }
      .bottom { transform: rotateX(-90deg) translateZ(125px); }

      /* Animations */
      .fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .glass-panel {
        background: rgba(20, 20, 20, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
<script type="importmap">
{
  "imports": {
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@^9.5.0",
    "@react-three/drei": "https://esm.sh/@react-three/drei@^10.7.7",
    "three": "https://esm.sh/three@^0.182.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",

    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1"
  }
}
</script>
</head>

  </body>
</html>
